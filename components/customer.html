<form id="clienteForm">

    <div class="form-group">
        <label for="codigo">Código Cliente</label>
        <input id="codigo" name="codigo" required>
    </div>

    <div class="form-group">
        <label for="razon_social">Razón social</label>
        <input id="razon_social" name="razon_social" required>
    </div>

    <div class="form-group">
        <label for="cuit">CUIT</label>
        <input id="cuit" name="cuit" inputmode="numeric">
    </div>

    <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input id="telefono" name="telefono" type="tel">
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email">
    </div>

    <button id="btnGuardar" type="submit">Guardar</button>

</form>
