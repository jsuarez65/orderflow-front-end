<form id="productForm">

    <div class="form-group">
        <label for="codigo">Código Producto</label>
        <input id="codigo" name="codigo" required>
    </div>

    <div class="form-group">
        <label for="descripcion">Descripción</label>
        <input id="descripcion" name="descripcion" required>
    </div>

    <div class="form-group">
        <label for="sku">SKU</label>
        <input id="sku" name="sku">
    </div>

    <div class="form-group">
        <label for="codigo_barras">Código de barras</label>
        <input id="codigo_barras" name="codigo_barras" type="text" inputmode="numeric">
    </div>

    <div class="form-group">
        <label for="stock_minimo">Stock mínimo</label>
        <input id="stock_minimo" name="stock_minimo" type="number" min="0" step="1" required>
    </div>

    <div class="form-group">
        <label for="stock_maximo">Stock máximo</label>
        <input id="stock_maximo" name="stock_maximo" type="number" min="0" step="1" required>
    </div>

    <button id="btnGuardar" type="submit">Guardar</button>

</form>
