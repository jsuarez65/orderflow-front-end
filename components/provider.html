<form id="providerForm">

    <div class="form-group">
        <label for="cuil">Cuil</label>
        <input id="cuil" name="cuil" required>
    </div>

    <div class="form-group">
        <label for="razon_social">Razón Social</label>
        <input id="razon_social" name="razon_social" required>
    </div>

    <div class="form-group">
        <label for="domicilio">Domicilio</label>
        <input id="domicilio" name="domicilio">
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email">
    </div>

    <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input id="telefono" name="telefono" type="number" min="0" step="1" required>
    </div>

    <div class="form-group">
        <label for="codigoPostal">Código Postal</label>
        <input id="codigoPostal" name="codigo_postal" type="number" min="0" step="1" required>
    </div>

    <button id="btnGuardar" type="submit">Guardar</button>

</form>
