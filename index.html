<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Administración de Maestros</title>
    <link rel="stylesheet" href="css/masters.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <h2>Maestros</h2>

        <button class="menu-item active" data-master="producto">Productos</button>
        <button class="menu-item" data-master="cliente">Clientes</button>
        <button class="menu-item" data-master="proveedor">Proveedores</button>
        <button class="menu-item" data-master="usuario">Usuarios</button>
        <button class="menu-item" data-master="rol">Roles</button>

    </aside>

    <main class="content">

        <h1 id="titulo">Productos</h1>

        <div class="toolbar">

            <button class="action active" data-action="nuevo">Nuevo</button>
            <button class="action" data-action="buscar">Buscar</button>
            <button class="action" data-action="modificar">Modificar</button>
            <button class="action" data-action="eliminar">Eliminar</button>

        </div>

        <form id="productoForm">

            <div class="form-group">
                <label>Código Producto</label>
                <input id="codigo">
            </div>

            <div class="form-group">
                <label>Descripción</label>
                <input id="descripcion">
            </div>

            <div class="form-group">
                <label>SKU</label>
                <input id="sku">
            </div>

            <div class="form-group">
                <label>Código de barras</label>
                <input id="codigo_barras" type="number">
            </div>

            <div class="form-group">
                <label>Stock mínimo</label>
                <input id="stock_minimo" type="number">
            </div>

            <div class="form-group">
                <label>Stock máximo</label>
                <input id="stock_maximo" type="number">
            </div>

            <button id="btnGuardar">Guardar</button>

        </form>

        <p id="mensaje"></p>

    </main>

</div>

<script src="js/masterProduct.js"></script>

</body>

</html>
